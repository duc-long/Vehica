server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: vehica-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Application-specific Properties
app:
  jwt:
    secret: ${JWT_SECRET:VehicaSecretKeyForJwtAuthenticationMustBeAtLeast32BytesLong2025!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours (86400000 ms)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:vehica-media}
    max-file-size-bytes: ${SUPABASE_MAX_FILE_SIZE:10485760} # 10MB
    ping-enabled: ${SUPABASE_PING_ENABLED:true}
    ping-cron: ${SUPABASE_PING_CRON:0 0 */4 * * *} # Ping every 4 hours to keep Supabase DB active


